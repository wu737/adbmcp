name: Publish to PyPI

# 触发方式:
#   1. 推 tag:  git tag v0.2.1 && git push origin v0.2.1
#   2. 手动:   Actions → Publish to PyPI → Run workflow
#
# 需要在仓库 Settings → Secrets 里配置:
#   PYPI_API_TOKEN  —— PyPI 的 API token (https://pypi.org/manage/account/token/)
#                     权限选 "pypi.org" 这一项

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号 (如 0.2.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装构建工具
        run: python -m pip install --upgrade build twine

      - name: 准备版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步版本号到 pyproject.toml
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          grep '^version' pyproject.toml

      - name: 构建 sdist 与 wheel
        run: python -m build

      - name: 校验包
        run: |
          python -m twine check dist/*
          echo "--- 包内容 ---"
          python - <<'EOF'
          import glob, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          z = zipfile.ZipFile(whl)
          for n in sorted(z.namelist()):
              print(f"  {z.getinfo(n).file_size:7d}  {n}")
          bad = [n for n in z.namelist()
                 if n.endswith((".sh", ".py")) and b"\r\n" in z.read(n)]
          print("CRLF 残留:", bad or "无")
          assert not bad, "脚本含 CRLF, Termux 下会报 bad interpreter"
          EOF

      - name: 上传到 PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*

      - name: 生成构建信息
        run: echo "发布完成: ${{ steps.ver.outputs.VERSION }}"
