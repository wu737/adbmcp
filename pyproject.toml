[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "adbmcp"
version = "0.2.0"
description = "Turn an Android phone (Termux) into an MCP server so AI clients can drive adb devices by natural language"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [{ name = "wu737" }]
keywords = [
    "mcp", "model-context-protocol", "termux", "adb", "android",
    "automation", "shell-automation", "device-control", "iot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
# 纯 Python 实现, 无运行时依赖 —— 避免在 Termux 上引入额外依赖冲突
dependencies = []

[project.urls]
Homepage = "https://github.com/wu737/adbmcp"
Repository = "https://github.com/wu737/adbmcp"
Issues = "https://github.com/wu737/adbmcp/issues"
Changelog = "https://github.com/wu737/adbmcp/releases"

[project.scripts]
adbmcp = "adbmcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adbmcp"]
# 排除字节码缓存
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

# 把仓库根的 scripts/ 原样打进 wheel 的 adbmcp/scripts/ 下,
# 避免维护两份副本 —— 根目录是唯一真源
[tool.hatch.build.targets.wheel.force-include]
"scripts" = "adbmcp/scripts"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/scripts",
    "/install",
    "/docs",
    "/examples",
    "/README.md",
    "/README.en.md",
    "/LICENSE",
]
